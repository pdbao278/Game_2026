<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Bộ lọc ánh sáng chiến đấu phình gai bộc phá (Puffer Spike Aura) -->
    <filter id="dash-glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="dash-body-grad" cx="42%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fee440" />
      <stop offset="60%" stop-color="#ff0054" />
      <stop offset="88%" stop-color="#7209b7" />
      <stop offset="100%" stop-color="#3a0ca3" />
    </radialGradient>

    <radialGradient id="shockwave-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fee440" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ff0054" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#7209b7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Hào quang sóng chấn động tỏa tròn -->
  <circle cx="32" cy="32" r="29" fill="url(#shockwave-grad)" />

  <!-- Vòng khiên năng lượng xoay -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#fee440" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.85" />

  <!-- Vành các gai nhọn bọc giáp phóng ra 8 hướng -->
  <!-- Gai trên đỉnh -->
  <polygon points="32,2 29,12 35,12" fill="#fee440" stroke="#ff0054" stroke-width="1" />
  <!-- Gai trên-phải -->
  <polygon points="53,11 43,18 48,23" fill="#fee440" stroke="#ff0054" stroke-width="1" />
  <!-- Gai bên phải -->
  <polygon points="62,32 52,29 52,35" fill="#fee440" stroke="#ff0054" stroke-width="1" />
  <!-- Gai dưới-phải -->
  <polygon points="53,53 48,41 43,46" fill="#fee440" stroke="#ff0054" stroke-width="1" />
  <!-- Gai dưới đáy -->
  <polygon points="32,62 35,52 29,52" fill="#fee440" stroke="#ff0054" stroke-width="1" />
  <!-- Gai dưới-trái -->
  <polygon points="11,53 21,46 16,41" fill="#fee440" stroke="#ff0054" stroke-width="1" />
  <!-- Gai bên trái -->
  <polygon points="2,32 12,35 12,29" fill="#fee440" stroke="#ff0054" stroke-width="1" />
  <!-- Gai trên-trái -->
  <polygon points="11,11 16,23 21,18" fill="#fee440" stroke="#ff0054" stroke-width="1" />

  <!-- Thân cá tròn phình to như quả cầu gai bọc thép -->
  <circle cx="32" cy="32" r="20" fill="url(#dash-body-grad)" stroke="#ffffff" stroke-width="1.8" filter="url(#dash-glow)" />

  <!-- Đèn lồng rực lửa vàng -->
  <path d="M 38 18 C 44 8, 48 8, 52 10" fill="none" stroke="#fee440" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="52" cy="10" r="4.5" fill="#ffffff" stroke="#fee440" stroke-width="1.5" />

  <!-- Mắt cá giận dữ / tập trung cao độ -->
  <ellipse cx="41" cy="28" rx="6" ry="6.5" fill="#ffffff" stroke="#7209b7" stroke-width="1.2" />
  <ellipse cx="43" cy="28" rx="4" ry="4" fill="#ff0054" />
  <circle cx="44.5" cy="27" r="1.6" fill="#ffffff" />
  <!-- Lông mày gai góc kiên quyết -->
  <path d="M 36 22 L 47 24" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

  <!-- Miệng cá bặm lại sẵn sàng va chạm vỡ đá -->
  <path d="M 44 38 C 42 36, 40 37, 38 38" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
</svg>

