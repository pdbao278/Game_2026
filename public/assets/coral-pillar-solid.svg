<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="solid-pillar-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="solid-rock-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="45%" stop-color="#1e1b4b" />
      <stop offset="85%" stop-color="#31104b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="crystal-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0aaff" />
      <stop offset="50%" stop-color="#7209b7" />
      <stop offset="100%" stop-color="#3a0ca3" />
    </linearGradient>
  </defs>

  <!-- Thân cột đá nguyên khối -->
  <rect x="6" y="8" width="52" height="56" rx="4" fill="url(#solid-rock-grad)" stroke="#3a0ca3" stroke-width="2" />

  <!-- Chóp gai san hô nhọn phía đầu cột -->
  <polygon points="6,12 16,0 26,10 38,2 50,11 58,12 58,18 6,18" fill="url(#crystal-purple)" stroke="#c77dff" stroke-width="1.2" filter="url(#solid-pillar-glow)" />

  <!-- Tinh thể thạch anh tím biển sâu đâm ngang thân -->
  <polygon points="12,28 20,24 24,30 16,34" fill="#7209b7" stroke="#e0aaff" stroke-width="1" />
  <polygon points="40,42 50,38 54,46 44,48" fill="#7209b7" stroke="#e0aaff" stroke-width="1" />

  <!-- Tĩnh mạch năng lượng tím chạy dọc thân đá -->
  <path d="M 28 18 Q 34 32 30 48 T 36 64" fill="none" stroke="#7209b7" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <path d="M 29 22 Q 33 32 31 46" fill="none" stroke="#e0aaff" stroke-width="1" stroke-linecap="round" />
</svg>

