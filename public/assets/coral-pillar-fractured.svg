<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="crack-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="fractured-rock-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d0036" />
      <stop offset="45%" stop-color="#4a0e4e" />
      <stop offset="100%" stop-color="#180022" />
    </linearGradient>

    <linearGradient id="neon-crack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fee440" />
      <stop offset="50%" stop-color="#ff0054" />
      <stop offset="100%" stop-color="#fee440" />
    </linearGradient>
  </defs>

  <!-- Thân cột đá san hô có dấu hiệu rạn vỡ -->
  <rect x="6" y="8" width="52" height="56" rx="4" fill="url(#fractured-rock-grad)" stroke="#ff0054" stroke-width="2" />

  <!-- Chóp gai cảnh báo màu hồng neon -->
  <polygon points="6,12 16,2 26,10 38,0 50,9 58,12 58,18 6,18" fill="#ff0054" stroke="#fee440" stroke-width="1.5" filter="url(#crack-glow)" />

  <!-- Khe nứt sâu phát sáng vàng rực chữ Z xuyên qua thân cột -->
  <path d="M 8 20 
           L 24 28 
           L 18 36 
           L 38 42 
           L 32 50 
           L 56 56" 
        fill="none" 
        stroke="#fee440" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#crack-glow)" />

  <path d="M 8 20 
           L 24 28 
           L 18 36 
           L 38 42 
           L 32 50 
           L 56 56" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="1.2" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Các nhánh nứt phụ tỏa ra -->
  <path d="M 24 28 L 32 24 M 18 36 L 10 44 M 38 42 L 48 38 M 32 50 L 26 58" 
        fill="none" 
        stroke="#ff0054" 
        stroke-width="1.5" 
        stroke-linecap="round" />

  <!-- Biểu tượng cảnh báo va chạm phá hủy -->
  <circle cx="48" cy="24" r="5" fill="#ff0054" opacity="0.8" />
  <text x="48" y="27" font-family="monospace" font-size="8" font-weight="bold" fill="#fee440" text-anchor="middle">!</text>
</svg>

