<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" width="120" height="80">
  <defs>
    <!-- Bộ lọc phát quang Neon Glow -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="fish-body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="60%" stop-color="#01baef" />
      <stop offset="100%" stop-color="#0b4f6c" />
    </linearGradient>
    <linearGradient id="fin-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#70e000" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Đuôi cá vẫy -->
  <path d="M 28 40 Q 5 15, 2 30 Q 15 40, 2 50 Q 5 65, 28 40 Z" fill="url(#fin-grad)" filter="url(#neon-glow)" />

  <!-- Vây lưng -->
  <path d="M 45 22 Q 60 5, 75 18 Q 62 24, 45 22 Z" fill="url(#fin-grad)" />

  <!-- Vây bụng dưới -->
  <path d="M 50 56 Q 65 72, 75 58 Q 62 55, 50 56 Z" fill="url(#fin-grad)" />

  <!-- Thân cá chính -->
  <ellipse cx="65" cy="40" rx="42" ry="24" fill="url(#fish-body-grad)" filter="url(#neon-glow)" />

  <!-- Họa tiết vảy phát quang -->
  <path d="M 52 30 Q 58 40, 52 50" stroke="#70e000" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round" />
  <path d="M 64 28 Q 70 40, 64 52" stroke="#70e000" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round" />
  <path d="M 76 32 Q 82 40, 76 48" stroke="#70e000" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round" />

  <!-- Mắt cá dạ quang -->
  <circle cx="88" cy="35" r="7" fill="#ffffff" />
  <circle cx="90" cy="35" r="4.5" fill="#03045e" />
  <circle cx="92" cy="33" r="1.8" fill="#00f5d4" />

  <!-- Vây bơi bên hông (Pectoral fin) -->
  <path d="M 62 42 Q 45 46, 42 58 Q 55 52, 62 42 Z" fill="#00f5d4" opacity="0.85" filter="url(#neon-glow)" />

  <!-- Bọt khí nhỏ theo sau -->
  <circle cx="12" cy="32" r="2.5" fill="#00f5d4" opacity="0.7" />
  <circle cx="6" cy="46" r="1.5" fill="#00f5d4" opacity="0.5" />
</svg>
