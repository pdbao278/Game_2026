<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="50" height="50">
  <defs>
    <radialGradient id="bubble-fill" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#a2d2ff" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#00f5d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#023e8a" stop-opacity="0.6" />
    </radialGradient>
  </defs>

  <!-- Viền và thân bong bóng nước trong suốt -->
  <circle cx="25" cy="25" r="22" fill="url(#bubble-fill)" stroke="#bde0fe" stroke-width="1.5" stroke-opacity="0.7" />

  <!-- Điểm lóa sáng chính góc trên trái -->
  <ellipse cx="18" cy="16" rx="6" ry="3.5" transform="rotate(-35 18 16)" fill="#ffffff" opacity="0.85" />
  <circle cx="15" cy="14" r="1.5" fill="#ffffff" />

  <!-- Viền phản quang dưới đáy -->
  <path d="M 18 38 A 17 17 0 0 0 36 34" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
</svg>
