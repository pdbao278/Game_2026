<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 400" width="100" height="400">
  <defs>
    <linearGradient id="coral-top-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#240046" />
      <stop offset="50%" stop-color="#5a189a" />
      <stop offset="90%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#ff0054" />
    </linearGradient>
    <filter id="top-glow" x="-20%" y="-10%" width="140%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Thân cột thạch nhũ san hô từ trần hang -->
  <path d="M 0 0 L 100 0 L 95 280 L 85 340 L 65 390 L 50 398 L 35 390 L 15 340 L 5 280 Z" fill="url(#coral-top-grad)" />

  <!-- Khía rãnh đá ngầm -->
  <path d="M 30 20 L 25 180 L 40 290 L 50 380" stroke="#3c096c" stroke-width="3" fill="none" opacity="0.7" />
  <path d="M 70 20 L 75 160 L 60 260 L 52 380" stroke="#7b2cbf" stroke-width="2.5" fill="none" opacity="0.6" />

  <!-- Nhánh san hô gai phát quang rực rỡ ở chóp nguy hiểm -->
  <path d="M 50 398 L 50 408" stroke="#ff0054" stroke-width="4" stroke-linecap="round" filter="url(#top-glow)" />
  <circle cx="50" cy="408" r="4" fill="#ff5400" filter="url(#top-glow)" />

  <!-- Đốm thạch anh dạ quang trên thân cột -->
  <circle cx="35" cy="120" r="3.5" fill="#00f5d4" opacity="0.8" />
  <circle cx="68" cy="220" r="4.5" fill="#ff70a6" opacity="0.9" />
  <circle cx="42" cy="310" r="3" fill="#ffd166" opacity="0.85" />
</svg>
