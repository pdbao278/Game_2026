<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="fish-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="fish-body-grad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#70e000" stop-opacity="0.2" />
      <stop offset="45%" stop-color="#00f5d4" />
      <stop offset="80%" stop-color="#0077b6" />
      <stop offset="100%" stop-color="#03045e" />
    </radialGradient>

    <linearGradient id="fin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#00f5d4" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#7209b7" stop-opacity="0.4" />
    </linearGradient>

    <radialGradient id="lure-light" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fee440" />
      <stop offset="85%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Hào quang đèn lồng trước trán -->
  <circle cx="50" cy="14" r="10" fill="url(#lure-light)" filter="url(#fish-glow)" />

  <!-- Cần đèn lồng uốn cong từ trán ra phía trước -->
  <path d="M 38 22 C 42 12, 45 10, 50 14" 
        fill="none" 
        stroke="#00f5d4" 
        stroke-width="2" 
        stroke-linecap="round" />

  <!-- Bóng đèn phát quang nhỏ -->
  <circle cx="50" cy="14" r="3.5" fill="#ffffff" stroke="#fee440" stroke-width="1" />

  <!-- Vây đuôi lượn sóng phía sau -->
  <path d="M 16 32 C 8 22, 2 26, 4 32 C 2 38, 8 42, 16 32 Z" 
        fill="url(#fin-grad)" 
        stroke="#00f5d4" 
        stroke-width="1.2" />

  <!-- Thân cá chính hình bầu dục khí động học -->
  <ellipse cx="32" cy="34" rx="18" ry="14" 
           fill="url(#fish-body-grad)" 
           stroke="#00f5d4" 
           stroke-width="1.5" 
           filter="url(#fish-glow)" />

  <!-- Vây lưng nhỏ -->
  <path d="M 24 21 C 28 16, 34 17, 36 21 Z" 
        fill="url(#fin-grad)" 
        stroke="#00f5d4" 
        stroke-width="1" />

  <!-- Vây bụng / vây bơi bên thân -->
  <path d="M 28 36 C 24 44, 32 46, 34 38 Z" 
        fill="url(#fin-grad)" 
        stroke="#ffffff" 
        stroke-width="1" />

  <!-- Hàng đốm sáng dạ quang sinh học dọc sống lưng -->
  <circle cx="23" cy="27" r="1.5" fill="#fee440" opacity="0.8" />
  <circle cx="28" cy="25" r="1.8" fill="#fee440" opacity="0.85" />
  <circle cx="34" cy="26" r="1.5" fill="#fee440" opacity="0.8" />

  <!-- Mắt cá to tròn long lanh -->
  <ellipse cx="40" cy="31" rx="5.5" ry="6" fill="#ffffff" stroke="#0077b6" stroke-width="1" />
  <ellipse cx="41.5" cy="31" rx="3.5" ry="4" fill="#03071e" />
  <!-- Điểm sáng phản chiếu trong mắt -->
  <circle cx="43" cy="29.5" r="1.5" fill="#ffffff" />
  <circle cx="40" cy="33" r="0.8" fill="#00f5d4" />

  <!-- Miệng cá mỉm cười thân thiện -->
  <path d="M 46 38 C 44 41, 41 40, 40 39" 
        fill="none" 
        stroke="#0077b6" 
        stroke-width="1.4" 
        stroke-linecap="round" />
</svg>

