<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Bộ lọc ánh sáng phát quang xà cừ (Bioluminescent Nacre Glow) -->
    <filter id="shell-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="pearl-light" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gradient Vỏ sò trên (Nắp sò trắng ngà xà cừ) -->
    <linearGradient id="shell-top-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#f1f5f9" />
      <stop offset="80%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Gradient Lòng vỏ sò dưới (Đáy sò ánh xà cừ ngọc lam / tím nhẹ) -->
    <radialGradient id="shell-inner-grad" cx="50%" cy="65%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0f2fe" />
      <stop offset="85%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </radialGradient>

    <!-- Gradient Khớp bản lề vỏ sò -->
    <linearGradient id="hinge-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Gradient Viên ngọc trai trắng tuyết 3D -->
    <radialGradient id="white-pearl-grad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </radialGradient>

    <!-- Hào quang ngọc tỏa sáng -->
    <radialGradient id="pearl-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#a7f3d0" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Hào quang biển sâu vòng ngoài -->
  <circle cx="32" cy="34" r="26" fill="url(#pearl-aura)" />

  <!-- 1. VỎ SÒ TRÊN (NẮP MỞ NGỬA RA PHÍA SAU) -->
  <g filter="url(#shell-glow)">
    <!-- Viền xòe hình quạt cánh sò nắp trên -->
    <path d="M 14 36 C 10 20 18 8 32 8 C 46 8 54 20 50 36 C 44 42 20 42 14 36 Z" 
          fill="url(#shell-top-grad)" 
          stroke="#e2e8f0" 
          stroke-width="1.2" />

    <!-- Các rãnh gân sò nắp trên (Scallop Ridges) -->
    <path d="M 32 10 L 32 38" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />
    <path d="M 24 13 C 26 22 28 32 30 38" stroke="#cbd5e1" stroke-width="1.1" stroke-linecap="round" opacity="0.75" />
    <path d="M 40 13 C 38 22 36 32 34 38" stroke="#cbd5e1" stroke-width="1.1" stroke-linecap="round" opacity="0.75" />
    <path d="M 17 21 C 21 27 26 34 29 39" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" opacity="0.7" />
    <path d="M 47 21 C 43 27 38 34 35 39" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" opacity="0.7" />

    <!-- Viền uốn lượn cạnh nắp trên -->
    <path d="M 14 36 C 16 33 20 35 24 33 C 28 31 36 31 40 33 C 44 35 48 33 50 36" 
          fill="none" 
          stroke="#f8fafc" 
          stroke-width="1.5" />
  </g>

  <!-- 2. LÒNG VỎ SÒ DƯỚI (NƠI ĐẶT VIÊN NGỌC) -->
  <g>
    <!-- Thân vỏ sò dưới hứng ngọc -->
    <path d="M 10 35 C 10 50 20 56 32 56 C 44 56 54 50 54 35 C 46 38 18 38 10 35 Z" 
          fill="url(#shell-inner-grad)" 
          stroke="#94a3b8" 
          stroke-width="1.2" />

    <!-- Bản lề đáy sò (Hinge) -->
    <path d="M 26 55 C 29 57 35 57 38 55 C 37 58 27 58 26 55 Z" fill="url(#hinge-grad)" />

    <!-- Các gân nổi ở vỏ dưới -->
    <path d="M 32 40 L 32 54" stroke="#7dd3fc" stroke-width="1.2" opacity="0.6" stroke-linecap="round" />
    <path d="M 23 39 C 26 44 28 50 30 53" stroke="#7dd3fc" stroke-width="1.1" opacity="0.6" stroke-linecap="round" />
    <path d="M 41 39 C 38 44 36 50 34 53" stroke="#7dd3fc" stroke-width="1.1" opacity="0.6" stroke-linecap="round" />

    <!-- Viền vành môi sò dưới màu trắng bóng -->
    <path d="M 10 35 C 18 39 46 39 54 35" fill="none" stroke="#ffffff" stroke-width="1.5" />
  </g>

  <!-- 3. VIÊN NGỌC TRAI TRẮNG TỎA SÁNG Ở TRUNG TÂM -->
  <g filter="url(#pearl-light)">
    <!-- Bóng đổ dưới viên ngọc -->
    <ellipse cx="32" cy="40" rx="9" ry="3.5" fill="#64748b" opacity="0.35" />

    <!-- Viên ngọc chính -->
    <circle cx="32" cy="34" r="8.5" fill="url(#white-pearl-grad)" stroke="#f8fafc" stroke-width="0.8" />

    <!-- Ánh phản quang xà cừ nhẹ màu ngọc lam -->
    <path d="M 26 36 C 28 40 36 40 38 36 C 36 41 28 41 26 36 Z" fill="#00f5d4" opacity="0.4" />

    <!-- Điểm sáng lóa (Specular Highlights) -->
    <ellipse cx="29.5" cy="30.5" rx="3" ry="1.8" transform="rotate(-30 29.5 30.5)" fill="#ffffff" opacity="0.95" />
    <circle cx="28.5" cy="29.5" r="1.1" fill="#ffffff" />
  </g>

  <!-- 4. TIA SÁNG LẤP LÁNH (SPARKLES) -->
  <!-- Ngôi sao sáng lớn -->
  <path d="M 39 21 L 40.5 25 L 44.5 26.5 L 40.5 28 L 39 32 L 37.5 28 L 33.5 26.5 L 37.5 25 Z" 
        fill="#ffffff" 
        opacity="0.9" />
  <!-- Ngôi sao nhỏ bên cạnh -->
  <path d="M 21 24 L 22 26.5 L 24.5 27.5 L 22 28.5 L 21 31 L 20 28.5 L 17.5 27.5 L 20 26.5 Z" 
        fill="#ffffff" 
        opacity="0.75" />
  <!-- Hạt ánh sáng tí hon -->
  <circle cx="43" cy="36" r="1" fill="#ffffff" opacity="0.8" />
  <circle cx="22" cy="37" r="0.8" fill="#ffffff" opacity="0.8" />
</svg>